structure         psf_dataset/1osi_autopsf.psf
coordinates       pdb_dataset/1osi_autopsf.pdb
outputName        min_1osi

set temperature   310

# Input
paraTypeCharmm      on
parameters          prova.inp 
#waterModel         tip3

temperature     $temperature

# Periodic Boundary conditions
#cellBasisVector1    43.5     0.       0.
#cellBasisVector2     0.     40.       0.
#cellBasisVector3     0.      0.      58.5
#cellOrigin          10.4     0.49    12.4

wrapWater           on
wrapAll             on

# Force-Field Parameters
exclude             scaled1-4
1-4scaling          1.0
cutoff              12.0
switching           on
switchdist          10.0
pairlistdist        14.0


# Integrator Parameters
timestep            1  ;# 1fs/step
rigidBonds          all  ;# needed for 2fs steps
nonbondedFreq       1
fullElectFrequency  2  
stepspercycle       10


#PME (for full-system periodic electrostatics)

PME                 no
PMEGridSpacing      1.0

#manual grid definition
PMEGridSizeX         128
PMEGridSizeY         128
PMEGridSizeZ         128



# Constant Temperature Control
langevin            on   ;# do langevin dynamics
langevinDamping     50.0    ;# damping coefficient (gamma) of 5/ps
langevinTemp        $temperature
langevinHydrogen    no    ;# don't couple langevin bath to hydrogens


# Constant Pressure Control (variable volume)

useGroupPressure      yes ;# needed for 2fs steps
useFlexibleCell       no  ;# no for water box, yes for membrane
useConstantArea       no  ;# no for water box, yes for membrane

langevinPiston        on
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  100.0
langevinPistonDecay   5.0
langevinPistonTemp    $temperature



restartfreq          100     ;# 500steps = every 1ps
dcdfreq              100
xstFreq              100
outputEnergies       50
#velDCDfreq           500               
#outputPressure      100

#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################

# Minimization

minimize           10000
reinitvels         $temperature


#run 3000 ;
